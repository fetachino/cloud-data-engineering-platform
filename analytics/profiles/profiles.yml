ecommerce_analytics:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_USER', 'platform') }}"
      password: "{{ env_var('DBT_PASSWORD', 'platform') }}"
      dbname: "{{ env_var('DBT_DATABASE', 'ecommerce') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'analytics') }}"
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"
      connect_timeout: 10
