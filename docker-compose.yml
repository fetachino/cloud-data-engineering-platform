services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "${KAFKA_PORT:-9092}:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka-init:
    image: apache/kafka:3.7.0
    command:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka:9092
      - --create
      - --if-not-exists
      - --topic
      - ecommerce.events.v1
      - --partitions
      - "1"
      - --replication-factor
      - "1"
    depends_on:
      kafka:
        condition: service_healthy

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql://platform:platform@postgres:5432/ecommerce
    depends_on:
      postgres:
        condition: service_healthy

  consumer:
    build: .
    command: python -m services.consumer.main
    environment:
      DATABASE_URL: postgresql://platform:platform@postgres:5432/ecommerce
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ecommerce.events.v1
      KAFKA_CONSUMER_GROUP: ecommerce-ingestion-local
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    expose:
      - "9101"
    restart: unless-stopped

  producer:
    build: .
    command: python -m services.producer.main --event-count ${EVENT_COUNT:-50} --rate-per-second ${EVENT_RATE:-5} --seed ${EVENT_SEED:-42}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ecommerce.events.v1
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      consumer:
        condition: service_started
    profiles:
      - producer

  analytics-dbt:
    build:
      context: .
      dockerfile: Dockerfile.analytics
    command: >
      bash -c "dbt build --project-dir /opt/airflow/analytics
      --profiles-dir /opt/airflow/analytics/profiles"
    environment:
      DBT_HOST: postgres
      DBT_PORT: 5432
      DBT_USER: ${POSTGRES_USER:-platform}
      DBT_PASSWORD: ${POSTGRES_PASSWORD:-platform}
      DBT_DATABASE: ${POSTGRES_DB:-ecommerce}
      DBT_SCHEMA: ${DBT_SCHEMA:-analytics}
      DBT_SOURCE_SCHEMA: ${DBT_SOURCE_SCHEMA:-public}
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles:
      - analytics

  airflow-analytics:
    build:
      context: .
      dockerfile: Dockerfile.analytics
    command: >
      bash -c "airflow db migrate &&
      airflow dags test ecommerce_analytics_pipeline ${AIRFLOW_ANALYTICS_EXECUTION_DATE:-2026-01-01}"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      ANALYTICS_DATABASE_URL: postgresql://platform:platform@postgres:5432/ecommerce
      SOURCE_MIN_PROCESSED_EVENTS: ${SOURCE_MIN_PROCESSED_EVENTS:-1}
      DBT_HOST: postgres
      DBT_PORT: 5432
      DBT_USER: ${POSTGRES_USER:-platform}
      DBT_PASSWORD: ${POSTGRES_PASSWORD:-platform}
      DBT_DATABASE: ${POSTGRES_DB:-ecommerce}
      DBT_SCHEMA: ${DBT_SCHEMA:-analytics}
      DBT_SOURCE_SCHEMA: ${DBT_SOURCE_SCHEMA:-public}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    profiles:
      - analytics

  analytics-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: uvicorn services.api.app:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@postgres:5432/${POSTGRES_DB:-ecommerce}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - dashboard

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      analytics-api:
        condition: service_started
    profiles:
      - dashboard

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    command:
      - --kafka.server=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9308/metrics >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
    profiles:
      - observability

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@postgres:5432/${POSTGRES_DB:-ecommerce}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9187/metrics >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
    profiles:
      - observability

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      kafka-exporter:
        condition: service_healthy
      postgres-exporter:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9090/-/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    profiles:
      - observability

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-observability}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    profiles:
      - observability

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
