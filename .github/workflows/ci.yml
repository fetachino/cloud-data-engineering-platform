name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && pip install ".[dev]"
      - name: Run tests
        run: pytest
      - name: Run Ruff
        run: ruff check .
      - name: Run mypy
        run: mypy

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run build

  infrastructure:
    name: Terraform and Compose checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform format check
        working-directory: infra/terraform
        run: terraform fmt -check -diff
      - name: Terraform init and validate
        working-directory: infra/terraform
        run: terraform init -backend=false && terraform validate
      - name: Compose configuration
        run: |
          docker compose config
          docker compose --profile analytics config
          docker compose --profile dashboard config
          docker compose --profile observability config
      - name: Install migration dependencies
        run: python -m pip install --upgrade pip && pip install .
      - name: Migration SQL generation
        run: alembic upgrade head --sql
